

<!DOCTYPE html>
<html>

<head>

<title>Login - Thakkar Travels</title>

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

margin:0;
font-family:Arial;
background-image: url("gokul.jpg");

display:flex;
justify-content:center;
align-items:center;

height:100vh;
/* Fixes the tiled image */
  background-image: url("gokul.jpg");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;

}

.card{

width:380px;

background:white;

padding:35px;

border-radius:16px;

box-shadow:0 0 20px rgba(0,0,0,.15);

}

.logo{

text-align:center;
margin-bottom:20px;

}

.logo img{

width:90px;

}

h2{

text-align:center;
color:#0d2b6b;

}

input,
select{

width:100%;

padding:12px;

margin:8px 0;

border:1px solid #ccc;

border-radius:8px;

font-size:15px;

box-sizing:border-box;

}

button{

width:100%;

padding:13px;

border:none;

background:#0d6efd;

color:white;

font-size:16px;

border-radius:8px;

cursor:pointer;

margin-top:10px;

}

button:hover{

background:#084298;

}

.links{

margin-top:15px;

text-align:center;

}

.links a{

text-decoration:none;
color:#0d6efd;

}

#otpBox{

display:none;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="/images/logo.png">

</div>

<h2>

THAKKAR TRAVELS

</h2>

<select id="role">

<option value="user">User Login</option>

<option value="agent">Agent Login</option>

</select>
<div style="margin-top:15px">

<a href="agent-registration.html">New Agent Registration</a>

</div>
<input
type="email"
id="email"
placeholder="Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="login()">

<i class="fa fa-sign-in-alt"></i>

Login

</button>

<div id="otpBox">

<input
type="text"
id="otp"
placeholder="Enter OTP"
>

<button onclick="verifyOtp()">

Verify OTP

</button>

</div>

<div class="links">

<a href="/forgot-password.html">

Forgot Password?

</a>

<br><br>

<a href="/registration.html">

Create Account

</a>

</div>

</div>
<div style="text-align:center;margin-top:15px;">

<a href="agent-registration.html">
Register As Agent
</a>

</div>

<script>

async function login(){

const res = await fetch(

'/auth/login',

{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

email:
document.getElementById("email").value,

password:
document.getElementById("password").value,

role:
document.getElementById("role").value

})

}

);

const data =
await res.json();

alert(data.message || data.error);

if(data.otpRequired){

document.getElementById("otpBox")
.style.display = "block";

}

}

async function verifyOtp(){

const res = await fetch(

'/auth/verify-login-code',

{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

email:
document.getElementById("email").value,

otp:
document.getElementById("otp").value

})

}

);

const data =
await res.json();

alert(data.message || data.error);

if(data.success){

window.location.href =
"/index.html";

}

}

</script>

</body>
</html>
