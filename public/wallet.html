<!DOCTYPE html>

<html>

<head>

    <title>Wallet</title>

</head>

<body>

<h2>Wallet Ledger</h2>

<table border="1" cellpadding="10">

<thead>

<tr>

    <th>Date</th>

    <th>Type</th>

    <th>Amount</th>

    <th>Before</th>

    <th>After</th>

    <th>Remark</th>

</tr>

</thead>
<input

type="number"

id="amount"

placeholder="Enter Amount"

/>

<button onclick="payNow()">

Pay With PhonePe

</button>

<tbody id="walletBody"></tbody>

</table>

<script>

async function loadWallet() {

    const res = await fetch('/booking/wallet', {

        credentials: 'include'

    });

    const data = await res.json();

    let html = '';

    data.forEach(tx => {

        html += `

        <tr>

            <td>

                ${new Date(tx.createdAt).toLocaleString()}

            </td>

            <td>

                ${tx.type}

            </td>

            <td>

                ₹${tx.amount}

            </td>

            <td>

                ₹${tx.balanceBefore}

            </td>

            <td>

                ₹${tx.balanceAfter}

            </td>

            <td>

                ${tx.remark}

            </td>

        </tr>

        `;

    });

    document.getElementById('walletBody').innerHTML = html;

}

loadWallet();


</script>
<script>

async function payNow(){

    const amount =

    document.getElementById(

        'amount'

    ).value;

    const user =

    JSON.parse(

        localStorage.getItem('user')

    );

    const res = await fetch(

        '/phonepe/pay',

        {

            method:'POST',

            headers:{

                'Content-Type':'application/json'

            },

            body:JSON.stringify({

                amount,

                userId:user._id

            })

        }

    );

    const data = await res.json();

    if(data.success){

        window.location.href = data.url;

    }

}

</script>

</body>

</html>
