<!DOCTYPE html>
<html>

<head>

    <title>Manual Booking Admin</title>

    <style>

        body{

            font-family:Arial;
            background:#f5f5f5;
            padding:20px;

        }

        .box{

            background:white;
            padding:20px;
            border-radius:10px;
            max-width:900px;
            margin:auto;
            box-shadow:0 0 10px rgba(0,0,0,.1);

        }

        input,select{

            width:100%;
            padding:10px;
            margin:8px 0;

        }

        button{

            padding:12px 20px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;

        }

        .pax{

            border:1px solid #ddd;
            padding:10px;
            margin:10px 0;

        }

    </style>

</head>

<body>

<div class="box">

<h2>Manual Flight Booking</h2>

<input type="text" id="userId" placeholder="User ID">

<input type="text" id="pnr" placeholder="PNR">

<input type="text" id="airline" placeholder="Airline">

<input type="text" id="flightNo" placeholder="Flight No">

<input type="text" id="origin" placeholder="Origin">

<input type="text" id="destination" placeholder="Destination">

<input type="text" id="departure" placeholder="Departure Time">

<input type="text" id="arrival" placeholder="Arrival Time">

<input type="text" id="date" placeholder="Travel Date">

<input type="number" id="amount" placeholder="Amount">

<input type="text" id="contactName" placeholder="Contact Name">

<input type="text" id="contactMobile" placeholder="Contact Mobile">

<input type="email" id="contactEmail" placeholder="Contact Email">

<hr>

<h3>Passengers</h3>

<div id="passengers"></div>

<button onclick="addPassenger()">
+ Add Passenger
</button>

<hr>

<button onclick="saveBooking()">
Save Booking
</button>

</div>

<script>

let paxCount = 0;

// ================= ADD PASSENGER =================

function addPassenger(){

    paxCount++;

    const div =
    document.createElement("div");

    div.className = "pax";

    div.innerHTML = `

        <h4>
            Passenger ${paxCount}
        </h4>

        <select class="title">

            <option>Mr</option>
            <option>Mrs</option>
            <option>Ms</option>

        </select>

        <input
            type="text"
            class="fname"
            placeholder="First Name"
        >

        <input
            type="text"
            class="lname"
            placeholder="Last Name"
        >

    `;

    document
    .getElementById("passengers")
    .appendChild(div);

}

// ================= SAVE BOOKING =================

async function saveBooking(){

    const passengerDivs =
    document.querySelectorAll(".pax");

    let passengers = [];

    passengerDivs.forEach(div=>{

        passengers.push({

            title:
            div.querySelector(".title").value,

            firstName:
            div.querySelector(".fname").value,

            lastName:
            div.querySelector(".lname").value

        });

    });

    const res =
    await fetch(

        '/admin/manual-booking',

        {

            method:'POST',

            headers:{
                'Content-Type':
                'application/json'
            },

            credentials:'include',

            body:JSON.stringify({

                userId:
                document.getElementById("userId").value,

                pnr:
                document.getElementById("pnr").value,

                airline:
                document.getElementById("airline").value,

                flightNo:
                document.getElementById("flightNo").value,

                origin:
                document.getElementById("origin").value,

                destination:
                document.getElementById("destination").value,

                departure:
                document.getElementById("departure").value,

                arrival:
                document.getElementById("arrival").value,

                date:
                document.getElementById("date").value,

                amount:
                document.getElementById("amount").value,

                contactName:
                document.getElementById("contactName").value,

                contactMobile:
                document.getElementById("contactMobile").value,

                contactEmail:
                document.getElementById("contactEmail").value,

                passengers

            })

        }

    );

    const data =
    await res.json();

    alert(
        data.message || data.error
    );

    if(data.booking){

        window.open(

            "/ticket.html?pnr=" +

            data.booking.pnr,

            "_blank"

        );

    }

}

// DEFAULT 1 PASSENGER

addPassenger();

</script>

</body>
</html>
