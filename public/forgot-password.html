<!DOCTYPE html>
<html>

<head>

<title>

Forgot Password

</title>

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

margin:0;
padding:0;

font-family:Arial;

background:#eef2f7;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

width:400px;

background:white;

padding:35px;

border-radius:16px;

box-shadow:0 0 20px rgba(0,0,0,.15);

}

.logo{

text-align:center;
margin-bottom:15px;

}

.logo img{

width:90px;

}

h2{

text-align:center;
color:#0d2b6b;
margin-bottom:25px;

}

input{

width:100%;

padding:12px;

margin:8px 0;

border:1px solid #ccc;

border-radius:8px;

font-size:15px;

box-sizing:border-box;

}

button{

width:100%;

padding:13px;

border:none;

background:#0d6efd;

color:white;

font-size:16px;

border-radius:8px;

cursor:pointer;

margin-top:10px;

}

button:hover{

background:#084298;

}

#resetBox{

display:none;

}

.links{

margin-top:15px;

text-align:center;

}

.links a{

text-decoration:none;
color:#0d6efd;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="/images/logo.png">

</div>

<h2>

Reset Password

</h2>

<!-- EMAIL -->

<input

type="email"

id="email"

placeholder="Enter Email"

>

<button onclick="sendOtp()">

<i class="fa fa-paper-plane"></i>

Send OTP

</button>

<!-- RESET BOX -->

<div id="resetBox">

<input

type="text"

id="otp"

placeholder="Enter OTP"

>

<input

type="password"

id="newPassword"

placeholder="New Password"

>

<button onclick="resetPassword()">

<i class="fa fa-key"></i>

Reset Password

</button>

</div>

<div class="links">

<a href="/login.html">

Back To Login

</a>

</div>

</div>

<script>

async function sendOtp(){

const email =

document.getElementById("email")
.value;

const res = await fetch(

'/auth/forgot-password',

{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

email

})

}

);

const data =
await res.json();

alert(

data.message || data.error

);

if(data.message){

document.getElementById("resetBox")
.style.display = "block";

}

}

async function resetPassword(){

const res = await fetch(

'/auth/reset-password',

{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

email:

document.getElementById("email")
.value,

otp:

document.getElementById("otp")
.value,

newPassword:

document.getElementById("newPassword")
.value

})

}

);

const data =
await res.json();

alert(

data.message || data.error

);

if(data.message){

window.location.href =
"/login.html";

}

}

</script>

</body>
</html>
