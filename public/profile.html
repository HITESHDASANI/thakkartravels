<!DOCTYPE html>

<html>

<head>
    <a href="index.html" style="
display:inline-block;
margin:20px;
padding:10px 20px;
background:#0b3d91;
color:white;
text-decoration:none;
border-radius:5px;
">
← Back to Home
</a>

<title>Profile</title>

<link
rel="stylesheet"
href="style.css">

<style>

.profile{

width:500px;

margin:auto;

margin-top:40px;

padding:20px;

background:white;

box-shadow:
0 0 10px #ddd;

}

.profile input{

width:100%;

padding:10px;

margin:10px 0;

}

</style>

</head>

<body>

<div class="profile">

<h2>

👤 My Profile

</h2>

<input
id="name"
placeholder="Name">

<input
id="email"
placeholder="Email">

<input
id="mobile"
placeholder="Mobile">

<button
onclick="saveProfile()">

Save

</button>

</div>

<script>

async function loadProfile(){

try{

const res=

await fetch(
'/auth/me',
{
credentials:
'include'
}
);

const user=

await res.json();

document
.getElementById(
'name'
).value=

user.name || "";

document
.getElementById(
'email'
).value=

user.email || "";

document
.getElementById(
'mobile'
).value=

user.mobile || "";

}

catch(e){

console.log(e);

}

}

function saveProfile(){

alert(
"Profile Updated"
);

}

loadProfile();

</script>

</body>

</html>
